# Drafted but disabled: runs only when triggered by hand.
# To enable on every push/PR, replace `workflow_dispatch:` with:
#   push:
#     branches: [main]
#   pull_request:
name: check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm test
